name: tests

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test tools
        run: pip install -r requirements.txt

      - name: Install the browser for the system tests
        run: python -m playwright install --with-deps chromium

      - name: Run unit, integration, system, and acceptance tests with coverage
        run: pytest tests/ -v --cov=src --cov=webapp --cov-report=term-missing
