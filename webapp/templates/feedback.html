{% extends "base.html" %}
{% block title %}Feedback{% endblock %}
{% block content %}
<h1>Almost done</h1>
<form id="feedback-form" class="card">
  <p>How easy was this training to use?</p>
  <div class="scale">
    {% for n in range(1, 6) %}
    <label><input type="radio" name="ease" value="{{ n }}"> {{ n }}{% if n == 1 %} (very hard){% elif n == 5 %} (very easy){% endif %}</label>
    {% endfor %}
  </div>
  <label for="comment">What, if anything, would you change about the training? (optional)</label>
  <textarea id="comment" rows="4" maxlength="1000"></textarea>
  <button type="submit">Finish</button>
  <p id="message" class="message" role="alert"></p>
</form>
<div id="done" class="card hidden"><h2>Thank you</h2><p>Your answers have been saved. You can close this page.</p></div>
{% endblock %}
{% block scripts %}<script>initFeedback();</script>{% endblock %}
